name: marketplace-purchase-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/database/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace
      RABBITMQ_URL: amqp://marketplace:marketplace@rabbitmq:5672
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_SHUTDOWN_TIMEOUT_MS: 10000
      SWAGGER_ENABLED: 'true'
      SWAGGER_PATH: docs
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace
      DATABASE_POOL_SIZE: 10
      DATABASE_STATEMENT_TIMEOUT_MS: 5000
      DATABASE_LOCK_TIMEOUT_MS: 3000
      RABBITMQ_URL: amqp://marketplace:marketplace@rabbitmq:5672
      RABBITMQ_EXCHANGE: marketplace.events
      RABBITMQ_PUBLISH_TIMEOUT_MS: 5000
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_MAX_ATTEMPTS: 10
      EVENT_LOOP_LAG_THRESHOLD_MS: 500
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
